services:
  mqtt-broker:
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
    networks:
      - mqtt--sensors
      - mqtt--backend
      - mqtt--prediction
    ports:
      - 18883:8883   # MQTTS for the sensor nodes (TLS)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  history-db:
    image: couchdb@sha256:8cf5f8442585c346d2717ff0ad95605731d2f19f67b8367840baa8d3b24ebc31
    volumes:
      - history-data:/opt/couchdb/data
    networks:
      - history--prediction
      - history--backend
    ports:
      - 127.0.0.1:5984:5984   # local only: training export and admin
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    restart: unless-stopped

  # One-shot job: databases, users, access rules and design docs (idempotent)
  history-db-init:
    image: couchdb@sha256:8cf5f8442585c346d2717ff0ad95605731d2f19f67b8367840baa8d3b24ebc31
    entrypoint: ["sh", "/couchdb-init.sh"]
    volumes:
      - ./scripts/couchdb-init.sh:/couchdb-init.sh:ro
      - ./config/couchdb/design:/config/design:ro
    networks:
      - history--backend
    environment:
      COUCHDB_URL: http://history-db:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_BACKEND_PASSWORD: ${COUCHDB_BACKEND_PASSWORD}
      COUCHDB_IA_PASSWORD: ${COUCHDB_IA_PASSWORD}
    depends_on:
      - history-db
    restart: "no"

  dashboard:
    image: node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    # TODO: switch to build once dashboard has a Dockerfile
    # build:
    #   context: https://github.com/ESPI-Workshop-Vig1l-8/dashboard.git#main
    networks:
      - dashboard--backend
    ports:
      - 10443:80
    
  backend:
    build:
      context: https://github.com/ESPI-Workshop-Vig1l-8/backend.git#main
    image: sentinel/backend:main
    volumes:
      - backend-data:/var/lib/backend
    environment:
      SQLITE_PATH: /var/lib/backend/sentinel.db
      MQTT_BROKER: tcp://mqtt-broker:1883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      COUCHDB_URL: http://history-db:5984
      COUCHDB_USER: backend
      COUCHDB_PASSWORD: ${COUCHDB_BACKEND_PASSWORD}
    depends_on:
      mqtt-broker:
        condition: service_started
      history-db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - history--backend
      - dashboard--backend
      - mqtt--backend
      - vision--backend

  ia-vision:
    image: python@sha256:d9368b3a5ac59afea7b5d4f2e2aea0941dbf9fdee9c369c5bec00b98244bc929
    # TODO: switch to build once IA_Vision has a Dockerfile
    # build:
    #   context: https://github.com/ESPI-Workshop-Vig1l-8/IA_Vision.git#main
    volumes:
      - vision-models:/models:ro
      - vision-cache:/root/.cache
    networks:
      - vision--backend

  ia-prediction:
    image: python@sha256:d9368b3a5ac59afea7b5d4f2e2aea0941dbf9fdee9c369c5bec00b98244bc929
    # TODO: switch to build once IA_Predictions has a Dockerfile
    # build:
    #   context: https://github.com/ESPI-Workshop-Vig1l-8/IA_Predictions.git#main
    volumes:
      - prediction-models:/models
      - prediction-cache:/root/.cache
    environment:
      MQTT_BROKER: tcp://mqtt-broker:1883
      MQTT_USERNAME: ia-prediction
      MQTT_PASSWORD: ${MQTT_PREDICTION_PASSWORD}
      COUCHDB_URL: http://history-db:5984
      COUCHDB_USER: ia
      COUCHDB_PASSWORD: ${COUCHDB_IA_PASSWORD}
    networks:
      - history--prediction
      - mqtt--prediction

  # reverse-proxy:
  #   image: nginx:latest
  #   volumes:
  #     - ./config/nginx:/etc/nginx/conf.d:ro
  #     - proxy-certs:/etc/letsencrypt

networks:
  history--prediction:
  history--backend:
  dashboard--backend:
  mqtt--backend:
  mqtt--sensors:
  mqtt--prediction:
  vision--backend:

volumes:
  mqtt-data:
  history-data:
  backend-data:
  vision-models:
  vision-cache:
  prediction-models:
  prediction-cache: