services:
  mqtt-broker:
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
    networks:
      - mqtt--sensors
      - mqtt--backend
    ports:
      - 18883:8883   # MQTTS for the sensor nodes (TLS)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  history-db:
    image: couchdb@sha256:8cf5f8442585c346d2717ff0ad95605731d2f19f67b8367840baa8d3b24ebc31
    volumes:
      - history-data:/opt/couchdb/data
    networks:
      - history--prediction
      - history--backend
    ports:
      - 127.0.0.1:5984:5984   # local only: training export and admin
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    restart: unless-stopped

  # One-shot job: databases, users, access rules and design docs (idempotent)
  history-db-init:
    image: couchdb@sha256:8cf5f8442585c346d2717ff0ad95605731d2f19f67b8367840baa8d3b24ebc31
    entrypoint: ["sh", "/couchdb-init.sh"]
    user: "5984:5984"   # the image's couchdb user: the overridden entrypoint would run as root
    volumes:
      - ./scripts/couchdb-init.sh:/couchdb-init.sh:ro
      - ./config/couchdb/design:/config/design:ro
    networks:
      - history--backend
    environment:
      COUCHDB_URL: http://history-db:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_BACKEND_PASSWORD: ${COUCHDB_BACKEND_PASSWORD}
      COUCHDB_IA_PASSWORD: ${COUCHDB_IA_PASSWORD}
    depends_on:
      - history-db
    restart: "no"

  # Static dashboard + reverse proxy (/api, /ws) to the backend: the only
  # HTTP entry point, the backend itself is not published.
  dashboard:
    build:
      context: https://github.com/ESPI-Workshop-Vig1l-8/dashboard.git#main
    image: sentinel/dashboard:main
    networks:
      - dashboard--backend
      - dashboard--vision
    ports:
      - 127.0.0.1:10443:8080   # localhost only: the dashboard is used on the server PC
    environment:
      # MJPEG stream of IA_Vision, proxied under /vision/ (resolved at request time)
      VISION_UPSTREAM: ${VISION_UPSTREAM:-http://ia-vision:8000}
    restart: unless-stopped
    
  backend:
    build:
      context: https://github.com/ESPI-Workshop-Vig1l-8/backend.git#main
    image: sentinel/backend:main
    environment:
      MQTT_BROKER: tcp://mqtt-broker:1883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      COUCHDB_URL: http://history-db:5984
      COUCHDB_USER: backend
      COUCHDB_PASSWORD: ${COUCHDB_BACKEND_PASSWORD}
      API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
    depends_on:
      mqtt-broker:
        condition: service_started
      history-db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - history--backend
      - dashboard--backend
      - mqtt--backend
      - prediction--backend
      - vision--backend

  # YOLO intrusion detection on the USB webcam: alerts to the backend, MJPEG
  # stream for the dashboard. LINUX ONLY: the webcam is passed with `devices`,
  # which Docker Desktop (Windows/macOS) does not support. On those systems,
  # remove this service (or `docker compose up -d --scale ia-vision=0`), run
  # IA_Vision on the host and set VISION_UPSTREAM (see README).
  ia-vision:
    build:
      context: https://github.com/ESPI-Workshop-Vig1l-8/IA_Vision.git#main
    image: sentinel/ia-vision:main
    devices:
      - ${VISION_CAMERA:-/dev/video0}:/dev/video0
    group_add:
      - ${VIDEO_GID:-44}   # gid of the host's "video" group (getent group video)
    environment:
      CAMERA: "0"
      BACKEND_URL: http://backend:5000
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      DEVICE_ID: ${VISION_DEVICE_ID:-VIG1L-8-NODE04}
    networks:
      - vision--backend
      - dashboard--vision
    depends_on:
      - backend
    restart: unless-stopped

  # Live anomaly detection (Isolation Forest) on the readings stored in CouchDB
  ia-prediction:
    build:
      context: https://github.com/ESPI-Workshop-Vig1l-8/IA_Predictions.git#main
    image: sentinel/ia-prediction:main
    volumes:
      - prediction-models:/models
    environment:
      FICHIER_MODELE: /models/modele_anomalies.joblib
      COUCHDB_URL: http://history-db:5984
      COUCHDB_USER: ia
      COUCHDB_PASSWORD: ${COUCHDB_IA_PASSWORD}
      BACKEND_URL: http://backend:5000
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
    networks:
      - history--prediction
      - prediction--backend
    depends_on:
      history-db-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  # reverse-proxy:
  #   image: nginx:latest
  #   volumes:
  #     - ./config/nginx:/etc/nginx/conf.d:ro
  #     - proxy-certs:/etc/letsencrypt

networks:
  history--prediction:
  history--backend:
  dashboard--backend:
  mqtt--backend:
  mqtt--sensors:
  prediction--backend:
  vision--backend:
  dashboard--vision:

volumes:
  mqtt-data:
  history-data:
  prediction-models:
