persistence true
persistence_location /mosquitto/data/

# Logs go to stdout; Docker rotates them (see logging in docker-compose.yaml)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Internal listener for the other containers. Not published on the host, so
# only services on the Docker networks can reach it.
listener 1883

# MQTTS listener for the sensor nodes, published on the host.
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
